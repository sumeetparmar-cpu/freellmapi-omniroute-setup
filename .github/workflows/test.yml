name: toolkit-tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: shellcheck
        run: shellcheck -x -S warning termux/*.sh termux/lib/common.sh tests/termux/*.sh scripts/*.sh vps/*.sh vps/lib/*.sh tests/vps/*.sh
      - name: secret scan
        run: scripts/check-secrets.sh
      - name: Free-only guard + policy tests (loopback mocks, no credentials)
        run: node --test tests/guard/*.test.mjs && bash tests/vps/free-install.test.sh && bash tests/vps/monitor-guard.test.sh && bash tests/vps/guard-backup.test.sh
      - name: Termux script tests (run on Linux)
        run: bash tests/termux/run-tests.sh && bash tests/termux/test-check-secrets.sh
      - name: PowerShell tests under pwsh on Linux
        run: pwsh -NoProfile -File tests/windows/run-tests.ps1
      - name: VPS toolkit tests (unprivileged part)
        run: bash tests/vps/run-tests.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: PowerShell tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\windows\run-tests.ps1
      - name: PowerShell tests (PowerShell 7)
        shell: pwsh
        run: ./tests/windows/run-tests.ps1

  # These two jobs make REAL system changes (test users, /srv/llm*); they run only on GitHub's disposable runner VMs and refuse to run elsewhere.
  vps-privileged:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: VPS toolkit tests incl. real users, isolation, units, verify, gwctl
        run: sudo env PATH="$PATH" LLM_TEST_ALLOW_SYSTEM_CHANGES=1 bash tests/vps/run-tests.sh

  vps-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: End-to-end rehearsal (pinned Node download, both real installs, quota-report, backup, verify)
        run: sudo env PATH="$PATH" LLM_TEST_ALLOW_SYSTEM_CHANGES=1 bash tests/vps/e2e-sandbox.sh

  # Real systemd + the two hosted Ubuntu LTS images: installs the guard/audit units with free-install.sh, starts them, kills them,
  # sandbox-probes them, drives the audit -> kill-switch loop. Also the Ubuntu 26.04 validation (real OS, real systemd).
  systemd-guard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Real-systemd guard/audit tests
        run: sudo env PATH="$PATH" LLM_TEST_ALLOW_SYSTEM_CHANGES=1 REQUIRE_SYSTEMD=1 bash tests/vps/systemd-guard.test.sh
      - name: Journal of the units (on failure)
        if: failure()
        run: sudo journalctl --no-pager -n 200 -u 'llm-guard-*' -u 'llm-free-audit-*' || true
